<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klang Valley Rail Transit Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { height: 100%; width: 100%; }

    .search-container {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      width: 300px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      overflow: visible;
    }
    .search-container input {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    #results {
      list-style: none;
      max-height: 300px;
      overflow-y: auto;
      display: none;
      border-top: 1px solid #eee;
    }
    #results.active { display: block; }
    #results li {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    #results li:hover { background: #f0f0f0; }
    #results li.no-results { color: #999; cursor: default; }

    #station-details {
      position: absolute;
      bottom: 30px;
      left: 10px;
      z-index: 1000;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      padding: 16px;
      min-width: 250px;
      display: none;
    }
    #station-details:not(:empty) { display: block; }
    #station-details h3 { margin-bottom: 8px; font-size: 16px; }
    #station-details table { width: 100%; border-collapse: collapse; }
    #station-details td {
      padding: 4px 8px;
      font-size: 13px;
      vertical-align: top;
    }
    #station-details td:first-child { white-space: nowrap; color: #555; }

    .legend {
      background: white;
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      font-size: 13px;
      line-height: 2;
    }
    .legend h4 { margin-bottom: 4px; font-size: 14px; }
    .legend-item { display: flex; align-items: center; }

    .station-marker { background: none !important; border: none !important; }

    @media (max-width: 600px) {
      .search-container { width: calc(100% - 20px); }
    }
  </style>
</head>
<body>
  <div class="search-container">
    <input id="search" type="text" placeholder="Search station, code, or line..." />
    <ul id="results"></ul>
  </div>
  <div id="station-details"></div>
  <div id="map"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
